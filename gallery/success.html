<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submitted — Patterns Denver</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      border: 1.5px solid #e8e4f0;
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .check {
      font-size: 40px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #645e6e;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #6436bf;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 24px;
      border-radius: 8px;
      text-decoration: none;
      letter-spacing: 0.01em;
    }
    .logo {
      margin-top: 28px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9893a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Output submitted</h1>
    <p>Your pair's work is in the gallery. The facilitators will share the full gallery link after the session.</p>
    <a href="/" class="btn">Back to gallery →</a>
    <div class="logo">Patterns Denver 2026 · Knapsack × Crux Digital × FuegoUX</div>
  </div>
</body>
</html>

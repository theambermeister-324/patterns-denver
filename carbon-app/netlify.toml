# Standalone Netlify config for the Carbon redesign.
# This is a SEPARATE site from the root netlify.toml (which publishes `gallery/`).
# When linking this as a new Netlify site from the patterns-denver repo, set the
# site's base directory to `carbon-app` — Netlify then reads this file and the
# paths below are relative to that base.
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client routes resolve to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
